openapi: 3.1.0
info:
  title: Ring Intercom Bridge
  version: 0.1.0
  description: >-
    Fail-closed control-plane contract. Media endpoints are intentionally absent
    until the Ring Intercom Audio protocol is independently verified.
servers:
  - url: http://127.0.0.1:8775
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Process liveness and delivery phase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/devices:
    get:
      operationId: listDevices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Alias-only device inventory
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/enrollments:
    post:
      operationId: startEnrollment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentStart"
      responses:
        "200":
          description: MFA challenge started or session completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentStarted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Another enrollment is active
        "422":
          description: Vendor credentials were rejected
        "429":
          description: Local or vendor rate limit
        "502":
          description: Vendor enrollment is unavailable
  /v1/enrollments/{enrollment}:
    parameters:
      - name: enrollment
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: verifyEnrollment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentVerify"
      responses:
        "200":
          description: Dedicated session persisted by the bridge
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: Challenge expired or was already consumed
        "422":
          description: Verification code was rejected
        "429":
          description: Vendor rate limit
        "502":
          description: Vendor enrollment is unavailable
    delete:
      operationId: cancelEnrollment
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Challenge absent or securely discarded
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/devices/{device}/capabilities:
    get:
      operationId: getCapabilities
      security:
        - bearerAuth: []
      parameters:
        - name: device
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]+$"
      responses:
        "200":
          description: Verified media capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown alias
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
  schemas:
    EnrollmentStart:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 1024
    EnrollmentStarted:
      type: object
      required: [enrollment_id, next_step, expires_in]
      properties:
        enrollment_id:
          type: string
          format: uuid
        next_step:
          enum: [otp, complete]
        expires_in:
          type: integer
          minimum: 0
          maximum: 120
    EnrollmentVerify:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          format: password
          pattern: "^[0-9]{6}$"
    Health:
      type: object
      required: [status, phase, version]
      properties:
        status:
          const: ok
        phase:
          const: protocol_research
        version:
          type: string
    Device:
      type: object
      required: [alias, kind, capabilities]
      properties:
        alias:
          type: string
        kind:
          enum: [ring_intercom_audio]
        capabilities:
          $ref: "#/components/schemas/Capabilities"
    Capabilities:
      type: object
      required: [available, phase]
      properties:
        available:
          type: array
          maxItems: 0
          items:
            enum:
              - live_audio_receive
              - live_audio_transmit
              - live_video_receive
              - recordings
        phase:
          const: protocol_research
