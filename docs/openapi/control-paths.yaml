Status:
  get:
    operationId: getRingStatus
    security: [{bearerAuth: []}]
    parameters: [{$ref: "../../openapi.yaml#/components/parameters/DeviceAlias"}]
    responses:
      "200":
        description: Bounded native Ring Intercom state
        content:
          application/json:
            schema:
              type: object
              required: [device_id, battery, online, doorbell_volume, mic_volume, voice_volume, last_activity]
              properties:
                device_id: {$ref: "./schemas.yaml#/ExpectedDeviceId"}
                battery: {type: [integer, "null"], minimum: 0, maximum: 100}
                online:
                  type: boolean
                  description: False only when Ring reports the Intercom connection as offline.
                doorbell_volume: {type: [integer, "null"], minimum: 0, maximum: 8}
                mic_volume: {type: [integer, "null"], minimum: 0, maximum: 11}
                voice_volume: {type: [integer, "null"], minimum: 0, maximum: 11}
                last_activity: {type: [integer, "null"], minimum: 0}
                unlock_settings:
                  type: object
                  additionalProperties: false
                  description: >-
                    Read-only Intercom unlock settings from Ring device
                    discovery (`settings.intercom_settings`), as managed in the
                    Ring app under Unlock Settings. Omitted when Ring reports
                    none; each field is omitted when unknown or malformed.
                  properties:
                    mode:
                      type: string
                      enum: [direct, ring_to_open]
                      description: >-
                        `direct` opens on any unlock command; `ring_to_open`
                        means the building system only opens during an active
                        call, so an unlock without someone pressing the call
                        button can be accepted by Ring yet leave the door shut.
                    ring_to_open_enabled: {type: boolean}
                    duration_seconds:
                      type: integer
                      minimum: 0
                      maximum: 600
                      description: >-
                        Analog systems only; whole seconds the door stays
                        unlocked (0 = under one second). A building system may
                        override it.
      "401": {$ref: "../../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../../openapi.yaml#/components/responses/ReauthRequired"}
      "404": {description: Unknown alias}
Unlock:
  post:
    operationId: unlockRingIntercom
    security: [{bearerAuth: []}]
    parameters: [{$ref: "../../openapi.yaml#/components/parameters/DeviceAlias"}]
    requestBody:
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              expected_device_id: {$ref: "./schemas.yaml#/ExpectedDeviceId"}
    responses:
      "204": {description: One Ring unlock command was accepted}
      "401": {$ref: "../../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../../openapi.yaml#/components/responses/ReauthRequired"}
      "404": {description: Unknown alias}
      "502": {description: Ring rejected or could not receive the command}
Settings:
  patch:
    operationId: updateRingIntercomVolume
    security: [{bearerAuth: []}]
    parameters: [{$ref: "../../openapi.yaml#/components/parameters/DeviceAlias"}]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            maxProperties: 2
            description: Exactly one volume and an optional physical device pin.
            properties:
              expected_device_id: {$ref: "./schemas.yaml#/ExpectedDeviceId"}
              doorbell_volume: {type: integer, minimum: 0, maximum: 8}
              mic_volume: {type: integer, minimum: 0, maximum: 11}
              voice_volume: {type: integer, minimum: 0, maximum: 11}
    responses:
      "204": {description: Exactly one volume was updated}
      "400": {description: Missing, multiple or out-of-range volume}
      "401": {$ref: "../../openapi.yaml#/components/responses/Unauthorized"}
      "403": {$ref: "../../openapi.yaml#/components/responses/ReauthRequired"}
      "404": {description: Unknown alias}
