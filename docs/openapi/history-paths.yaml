History:
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/DeviceAlias"
    - $ref: "#/ExpectedDevice"
    - name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}
    - name: cursor
      in: query
      description: Opaque cursor returned by the previous page.
      schema: {type: string, pattern: "^[0-9]{1,32}$"}
  get:
    operationId: getRingHistory
    security: [{bearerAuth: []}]
    responses:
      "200":
        description: One bounded provider page plus safe device and Location names.
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/HistoryPage"
      "400": {description: Invalid limit or cursor.}
      "401": {$ref: "../../openapi.yaml#/components/responses/Unauthorized"}
      "404": {description: Unknown alias.}
      "502": {description: Ring activity history is unavailable.}
ActivityProbe:
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/DeviceAlias"
  get:
    operationId: probeRingActivityFeeds
    summary: Read-only, redacted diagnostics of Ring activity feeds.
    description: >-
      Summarizes each candidate Ring feed by HTTP status, top-level field
      names, enum-like kind labels and newest timestamp. No IDs, names or free
      text are returned. Used to find which feed records app unlocks.
    security: [{bearerAuth: []}]
    responses:
      "200": {description: One redacted summary per probed feed.}
      "401": {$ref: "../../openapi.yaml#/components/responses/Unauthorized"}
      "404": {description: Unknown alias.}
      "502": {description: Ring is unavailable.}
ExpectedDevice:
  name: expected_device_id
  in: query
  description: Required for legacy aliases without a configured physical binding; mismatches fail closed.
  schema: {$ref: "./schemas.yaml#/ExpectedDeviceId"}
