Recordings:
  post:
    operationId: uploadRecording
    security: [{bearerAuth: []}]
    parameters:
      - $ref: "../../openapi.yaml#/components/parameters/DeviceAlias"
      - name: started_at
        in: query
        required: true
        schema: {type: integer, format: int64}
      - name: ended_at
        in: query
        required: true
        schema: {type: integer, format: int64}
    requestBody:
      required: true
      content:
        audio/webm:
          schema: {type: string, format: binary, minLength: 128, maxLength: 8388608}
        audio/mp4:
          schema: {type: string, format: binary, minLength: 128, maxLength: 8388608}
    responses:
      "201":
        description: Locally captured Vistoda call committed atomically
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/RecordingItem"
      "400": {description: Media or bounded timestamps are invalid}
      "401":
        $ref: "../../openapi.yaml#/components/responses/Unauthorized"
  get:
    operationId: listRecordings
    security: [{bearerAuth: []}]
    parameters:
      - $ref: "../../openapi.yaml#/components/parameters/DeviceAlias"
    responses:
      "200":
        description: Private retained recording metadata
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/RecordingList"
Recording:
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/DeviceAlias"
    - name: recording
      in: path
      required: true
      schema: {type: string, format: uuid}
  get:
    operationId: getRecording
    security: [{bearerAuth: []}]
    responses:
      "200":
        description: Bounded locally captured Vistoda recording
        content:
          audio/mp4:
            schema: {type: string, format: binary}
          audio/webm:
            schema: {type: string, format: binary}
      "404": {description: Recording is absent}
  delete:
    operationId: deleteRecording
    security: [{bearerAuth: []}]
    responses:
      "204": {description: Recording removed or already absent}
