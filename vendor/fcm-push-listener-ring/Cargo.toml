[package]
name = "fcm-push-listener-ring"
version = "4.0.3-vistoda.1"
edition = "2021"
description = "Vistoda-maintained FCM listener for Ring Android registration"
license = "MIT"
repository = "https://github.com/luigibarretta/vistoda-ring"
keywords = ["push", "fcm", "ring"]
readme = "README.md"

[lib]
name = "fcm_push_listener"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
bytes = "1.10"
ece = "2.3.1"
log = "0.4"
pin-project-lite = "0.2.16"
prost = "0.13.5"
rand = "0.9"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = "1.0"
serde_with = { version = "3.12", default-features = false, features = ["macros"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "net"] }
tokio-rustls = "0.26.2"
tokio-stream = "0.1"
uuid = { version = "1.15", features = ["v4", "fast-rng", "macro-diagnostics"] }
webpki-roots = "1"

[build-dependencies]
prost-build = "0.13.5"
