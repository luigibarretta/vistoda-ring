name: ci
on:
  push:
    branches: [main]
  pull_request:
# Checks come from ci-local.json through the vendored ci-local runner, the same
# entry point used before a push (`node third_party/repo-tooling/ci-local.mjs
# --quick`, then the full gate). Every manifest step runs in exactly one call
# below (tests/ci_local_jobs.rs). Plain workflow steps are CI-only: checkouts,
# the repo-tooling pin check, system packages, toolchains, caches, cargo-audit
# installation and the container image build and smoke test.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CI-only: verifies third_party/repo-tooling against a checkout of the
      # commit pinned in dependencies/repo-tooling.sha.
      - name: Checkout pinned repository tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: luigibarretta/repo-tooling
          ref: 7c1288562bb7ae8c5e111cf7da965cc69830cdd7
          path: .ci/repo-tooling
      - name: Verify pinned repository tooling
        run: scripts/check-repo-tooling-sync.sh
      - name: Install CI system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends protobuf-compiler
          rm -rf /var/lib/apt/lists/*
      # Use a reachable mainline action commit; version branches are rewritten upstream.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.96.1"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      # The provider-kit step fetches lib-vistoda-provider-kit at
      # dependencies/vistoda-provider-kit.sha from its public source of truth.
      - name: Provider kit, release identity, rustfmt and dependency audit
        run: node third_party/repo-tooling/ci-local.mjs --ci --only provider-kit,release-check,rust-fmt,audit-lockfiles
      - name: Clippy, ci-local job ownership, LOC budget and Rust tests
        run: node third_party/repo-tooling/ci-local.mjs --ci --only rust-clippy,ci-local-jobs,loc-budget,rust-test
      # CI-only from here on: the container image build and its smoke test.
      - name: Build standalone image at the declared version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test -n "${version}"
          docker build --build-arg "VERSION=${version}+ci" --build-arg REVISION=ci \
            --tag ring-intercom-bridge:test .
          test "$(docker image inspect ring-intercom-bridge:test \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" \
            = "${version}+ci"
      - run: >-
          docker run --rm --network none --read-only --user 10001:10001
          ring-intercom-bridge:test --version
  secret-scan:
    # Mirrors the GitHub secret-scan job without GitHub's API: the secret-scan
    # step installs gitleaks at a pinned version and checksum and scans the
    # full history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        run: node third_party/repo-tooling/ci-local.mjs --ci --only secret-scan
